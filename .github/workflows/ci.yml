name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax compile check
        run: python -m compileall -q src tests
      - name: Run unit tests (stdlib unittest, zero install)
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: |
          PYTHONPATH=src python -m proseguard --list-rules
          # Findings must yield exit code 1; tolerate it under `set -e`.
          set +e
          echo "This is definately wrong." | PYTHONPATH=src python -m proseguard - >/dev/null
          rc=${PIPESTATUS[1]}
          set -e
          echo "smoke exit code: $rc"
          test "$rc" -eq 1
